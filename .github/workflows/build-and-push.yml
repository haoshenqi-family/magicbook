name: Build and Push to Aliyun

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

env:
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ALIYUN_NAMESPACE: magichouse
  IMAGE_NAME: calibre-web-ai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read snapshot version
        id: version
        run: |
          if [ -f deploy/.snapshot-version ]; then
            VERSION=$(cat deploy/.snapshot-version | tr -d '[:space:]')
          else
            VERSION="unknown-$(date '+%Y%m%d.%H%M%S')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "==> 构建版本: $VERSION"

      - name: Login to Aliyun Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

