{% extends "layout.html" %}

{% block body %}
<div class="mail-page-shell" id="mail-page" data-mail-page="1">
  <div class="mail-page-head">
    <div>
      <h1>{{_('Mail')}}</h1>
      <div id="mail-page-unread-count" class="text-muted" aria-live="polite">{{_('Checking mail...')}}</div>
    </div>
    <div class="mail-page-head-actions">
      <button id="mail-mark-all" class="mail-page-mark-all" type="button" disabled>{{_('Mark all as read')}}</button>
    </div>
  </div>

  <div id="mail-page-loading" class="mail-page-loading" role="status">{{_('Loading mail...')}}</div>
  <div id="mail-page-empty" class="mail-page-empty" hidden>{{_('No mail yet')}}</div>
  <div id="mail-page-error" class="mail-page-error" role="alert" hidden>
    <span class="mail-page-error-text"></span>
    <button id="mail-page-retry" class="btn btn-default btn-sm" type="button">{{_('Retry')}}</button>
  </div>
  <div id="mail-page-list" hidden></div>
  <div id="mail-page-pager" class="mail-page-pager" hidden>
    <button id="mail-page-prev" type="button">{{_('Previous')}}</button>
    <span id="mail-page-indicator"></span>
    <button id="mail-page-next" type="button">{{_('Next')}}</button>
  </div>
</div>
{% endblock %}
