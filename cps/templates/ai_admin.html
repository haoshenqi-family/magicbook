{% extends "layout.html" %}
{% block body %}
<div class="container-fluid">
  <div class="row">
    <div class="col-sm-10">
      <h2>{{_('AI Companion Settings')}}</h2>
      <form method="post" action="{{ url_for('aichat.admin') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label><input type="checkbox" name="enabled" {% if config.enabled %}checked{% endif %}> {{_('Enable AI Companion')}}</label>
        </div>
        <div class="form-group">
          <label><input type="checkbox" name="memory_enabled" {% if config.memory_enabled %}checked{% endif %}> {{_('Enable long-term memory')}}</label>
        </div>
        <div class="form-group">
          <label>{{_('Default Provider')}}</label>
          <select name="default_provider" class="form-control">
            {% for p in available_providers %}
            <option value="{{ p }}" {% if config.default_provider == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>{{_('Default Model')}}</label>
          <input type="text" name="default_model" class="form-control" value="{{ config.default_model }}">
        </div>
        <div class="form-group">
          <label>{{_('Extract memory every N messages')}}</label>
          <input type="number" name="memory_extract_interval" class="form-control" value="{{ config.memory_extract_interval }}" min="1" max="100">
        </div>
        <div class="form-group">
          <label>{{_('Extra system prompt instructions')}}</label>
          <textarea name="system_prompt_extra" class="form-control" rows="3">{{ config.system_prompt_extra }}</textarea>
        </div>

        <h3>{{_('Providers')}}</h3>
        {% for prov in providers %}
        <div class="panel panel-default">
          <div class="panel-heading">
            <h4>{{ prov.display_name or prov.provider_name }}
              <label class="pull-right"><input type="checkbox" name="provider_{{ prov.id }}_delete"> {{_('Delete')}}</label>
              <label class="pull-right" style="margin-right:15px"><input type="checkbox" name="provider_{{ prov.id }}_active" {% if prov.active %}checked{% endif %}> {{_('Active')}}</label>
            </h4>
          </div>
          <div class="panel-body">
            <div class="form-group">
              <label>{{_('Provider Name')}}</label>
              <input type="text" class="form-control" value="{{ prov.provider_name }}" readonly>
            </div>
            <div class="form-group">
              <label>{{_('API Base URL')}}</label>
              <input type="text" name="provider_{{ prov.id }}_api_base" class="form-control" value="{{ prov.api_base }}">
            </div>
            <div class="form-group">
              <label>{{_('API Key')}} {{_('(leave blank to keep current)')}}</label>
              <input type="password" name="provider_{{ prov.id }}_api_key" class="form-control" placeholder="sk-...">
            </div>
            <div class="form-group">
              <label>{{_('Models (one per line, format: id|label)')}}</label>
              <textarea name="provider_{{ prov.id }}_models" class="form-control" rows="3">{% set models = prov.models_json | from_json %}{% for m in models %}{{ m.id }}|{{ m.label }}
{% endfor %}</textarea>
            </div>
            <div class="form-group">
              <label>{{_('Test connection (uses the fields above)')}}</label>
              <div class="input-group">
                <input type="text" id="provider_{{ prov.id }}_test_model" class="form-control" placeholder="{{_('Model id to test')}}">
                <span class="input-group-btn">
                  <button type="button" class="btn btn-default" onclick="testProvider({{ prov.id }})">{{_('Test')}}</button>
                </span>
              </div>
              <div id="provider_{{ prov.id }}_test_result" class="help-block"></div>
            </div>
          </div>
        </div>
        {% endfor %}

        <h3>{{_('Add Provider')}}</h3>
        <div class="panel panel-default">
          <div class="panel-body">
            <div class="row">
              <div class="col-sm-4 form-group">
                <label>{{_('Provider Name')}}</label>
                <input type="text" name="new_provider_name" class="form-control" placeholder="{{_('e.g. my-openai')}}">
              </div>
              <div class="col-sm-4 form-group">
                <label>{{_('Display Name')}}</label>
                <input type="text" name="new_provider_display" class="form-control" placeholder="{{_('e.g. My OpenAI')}}">
              </div>
              <div class="col-sm-4 form-group">
                <label>{{_('API Base URL')}}</label>
                <input type="text" name="new_provider_api_base" class="form-control" placeholder="https://...">
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">{{_('Save')}}</button>
        <a href="{{ url_for('admin.admin') }}" class="btn btn-default">{{_('Back to Admin')}}</a>
      </form>
    </div>
  </div>
</div>
<script>
  var TEST_PROVIDER_URL = "{{ url_for('aichat.test_provider') }}";
  function testProvider(id) {
    var $base = $('input[name="provider_' + id + '_api_base"]');
    var $key = $('input[name="provider_' + id + '_api_key"]');
    var $model = $('#provider_' + id + '_test_model');
    var $result = $('#provider_' + id + '_test_result');
    var apiBase = $base.val().trim();
    var model = $model.val().trim();
    if (!apiBase || !model) {
      $result.text('{{_("Please fill API Base URL and model to test.")}}').css('color', 'orange');
      return;
    }
    var apiKey = $key.val().trim();
    // If the key field is left blank it may mean "keep current stored key" —
    // read it from the existing value placeholder only when actually provided.
    $result.text('{{_("Testing...")}}').css('color', '#888');
    $.ajax({
      url: TEST_PROVIDER_URL,
      method: 'POST',
      contentType: 'application/json',
      headers: { 'X-CSRFToken': $('input[name="csrf_token"]').val() || '' },
      data: JSON.stringify({ provider_id: id, api_base: apiBase, api_key: apiKey, model: model }),
      success: function (res) {
        var text = '';
        if (res.ok) {
          text = '{{_("OK:")}} ' + res.reply;
        } else {
          text = '{{_("Failed:")}} ' + res.error;
        }
        if (res.models && res.models.length) {
          text += ' {{_("Models:")}} ' + res.models.join(', ');
        }
        $result.text(text).css('color', res.ok ? 'green' : 'red');
      },
      error: function (xhr) {
        var msg = xhr.status + ' ' + xhr.statusText;
        try { msg += ' - ' + (JSON.parse(xhr.responseText).error || ''); } catch (e) {}
        $result.text('{{_("Failed:")}} ' + msg).css('color', 'red');
      }
    });
  }
</script>
{% endblock %}
