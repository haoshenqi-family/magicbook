# magicbook 日志采集配置（Filebeat 8.11.3，与 ES 8.11.3 同版本）
# Calibre-Web 日志默认落在配置目录（容器内 /config，compose 挂载为只读 /var/log/magicbook）：
#   calibre-web.log 应用日志（仅 DEBUG 级别时改走容器 stdout，不落此文件）
#   access.log    访问日志（管理后台开启后才生成）
# 写入 ES 索引 app-log-magicbook；索引模板与 180 天保留策略由 deploy/init-app-log-es.sh 创建
filebeat.inputs:
  - type: filestream
    id: magicbook-app-log
    enabled: true
    paths:
      - /var/log/magicbook/calibre-web.log
      - /var/log/magicbook/access.log
    fields:
      module: magicbook
    fields_under_root: true
    processors:
      - script:
          lang: javascript
          id: parse_log_level
          # 从日志行提取级别 → log.level（keyword，Kibana 可直接过滤聚合）
          # 命中不了（堆栈行/访问日志行）保持 filebeat 默认 info，不丢行
          source: >-
            function process(event) {
              var msg = event.Get("message");
              var m = /^(?:\d{4}-\d{2}-\d{2}[T ][^ ]*\s+|\[[^\]]+\]\s+)(TRACE|DEBUG|INFO|WARN|CRIT|ERROR|FATAL)\s+/.exec(msg);
              if (m) {
                var level = m[1];
                if (level === "CRIT") { level = "critical"; }
                event.Put("log.level", level.toLowerCase());
              }
            }

output.elasticsearch:
  hosts: ["${LOG_ES_HOSTS}"]
  username: "${LOG_ES_USERNAME}"
  password: "${LOG_ES_PASSWORD}"
  index: "app-log-magicbook"
  # es.haoshenqi.top 为 Let's Encrypt 有效证书可改 full；直连内网 IP/自签证书时必须为 none
  ssl.verification_mode: none

setup.template.enabled: false
setup.ilm.enabled: false
